<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banc TM Rapport</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 16px; background: #f1f5f9; color: #0f172a; }
  button, a.bouton { display: block; width: 100%; margin: 6px 0; padding: 10px; font-size: 16px; border-radius: 10px;
                     border: 1px solid #cbd5e1; background: white; color: #0f172a; text-align: center; text-decoration: none; }
  #resultat { margin-top: 12px; padding: 10px; background: #1e3a5f; color: white; border-radius: 10px; min-height: 22px; }
</style>
</head>
<body>
<!--
  Banc d'essai de l'application Apple. Il n'est PAS le site : il actionne,
  dans la vraie vue web de l'app, ce que le site utilise et qu'une vue web
  ne fait pas d'elle-même — boîtes de dialogue, fenêtres, téléchargements —
  et le coffre natif. Servi en local pendant les tests d'interface.
-->
<p id="resultat" aria-label="resultat">pret</p>
<button id="alerte" onclick="alert('Bonjour du banc'); dire('alerte vue')">Alerte</button>
<button id="confirmer" onclick="dire(confirm('Supprimer cette photo ?') ? 'confirme oui' : 'confirme non')">Confirmer</button>
<button id="saisir" onclick="dire('saisi ' + prompt('Nom du lot ?', 'Cab1'))">Saisir</button>
<button id="fenetre" onclick="window.open('/document.pdf', '_blank')">Ouvrir fenetre</button>
<a class="bouton" id="telecharger" href="/document.pdf" download="banc.pdf">Telecharger</a>
<button id="deposer" onclick="deposer()">Coffre deposer</button>
<button id="inventaire" onclick="inventaire()">Coffre inventaire</button>
<button id="retirer" onclick="retirer()">Coffre retirer</button>
<button id="pont" onclick="dire(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tmCoffre ? 'pont present' : 'pont absent')">Pont</button>
<button id="camera" onclick="camera()">Camera</button>
<button id="synchros" onclick="dire('synchros ' + (localStorage.getItem('banc-synchros') || 'aucune'))">Synchros</button>
<button id="effacer-synchros" onclick="localStorage.removeItem('banc-synchros'); dire('synchros effacees')">Effacer synchros</button>
<button id="export-blob" onclick="exporterBlob()">Exporter blob</button>
<button id="pdf-blob" onclick="ouvrirPdfBlob()">PDF blob fenetre</button>
<a class="bouton" id="lien-externe" href="https://example.com/">Lien externe</a>
<button id="fenetre-externe" onclick="fenetreExterne()">Fenetre externe</button>
<a class="bouton" id="appeler" href="tel:+41790000000">Appeler</a>
<a class="bouton" id="ecrire" href="mailto:essai@exemple.invalid?subject=Banc">Ecrire</a>
<button id="copier" onclick="copier()">Copier</button>
<button id="position" onclick="position()">Position</button>
<button id="micro" onclick="micro()">Micro</button>
<button id="capacites" onclick="capacites()">Capacites</button>
<label>Photo <input id="fichier" type="file" accept="image/*" onchange="dire('fichier ' + (this.files[0] ? this.files[0].type : 'aucun'))"></label>
<script>
  // Témoin : l'app appelle window.tmApple.synchroniser(raison) au départ en
  // arrière-plan, au retour, au retour du réseau. Le banc note chaque appel.
  window.tmApple = {
    synchroniser: async function (raison) {
      var t = (localStorage.getItem('banc-synchros') || '').split(' ').filter(Boolean);
      t.push(raison);
      localStorage.setItem('banc-synchros', t.slice(-8).join(' '));
      return { photosEnAttente: 0, photosEnEchec: 0, requetesEnAttente: 0, rapportsNonEnvoyes: 0, enLigne: true };
    }
  };
  function dire(t) { var r = document.getElementById('resultat'); r.textContent = t; r.setAttribute('aria-label', t); }
  var tm = function (m) { return window.webkit.messageHandlers.tmCoffre.postMessage(m); };
  // Les octets d'une « photo » de test : connus, pour vérifier l'aller-retour.
  var OCTETS = 'AQID/9j/4AAQ';
  async function deposer() {
    try {
      var r = await tm({ action: 'deposerPhoto', id: 'banc-photo-1', meta: JSON.stringify({ id: 'banc-photo-1', projectId: 'banc' }),
                         fichiers: [{ nom: 'banc.jpg', type: 'image/jpeg', base64: OCTETS }] });
      dire('depot ' + (r.ok ? 'ok' : 'non') + (r.nouveau ? ' nouveau' : ' deja'));
    } catch (e) { dire('depot erreur ' + e); }
  }
  async function inventaire() {
    try {
      var inv = await tm({ action: 'inventaire' });
      var ids = inv.photos.map(function (p) { return p.id; });
      var octets = '';
      if (ids.indexOf('banc-photo-1') >= 0) {
        var p = await tm({ action: 'photo', id: 'banc-photo-1' });
        octets = p.fichiers[0].base64 === OCTETS ? ' octets intacts' : ' octets alteres';
      }
      dire('inventaire ' + ids.length + octets);
    } catch (e) { dire('inventaire erreur ' + e); }
  }
  async function retirer() {
    try { var r = await tm({ action: 'retirerPhoto', id: 'banc-photo-1', motif: 'banc' }); dire('retrait ' + (r.ok ? 'ok' : 'non')); }
    catch (e) { dire('retrait erreur ' + e); }
  }
  async function pdfBlob() { return await (await fetch('/document.pdf')).blob(); }
  // Comme l'export des heures : un fichier fabriqué par la page, téléchargé.
  async function exporterBlob() {
    var url = URL.createObjectURL(await pdfBlob());
    var a = document.createElement('a'); a.href = url; a.download = 'export-banc.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    dire('export lance');
  }
  // Comme les PDF de statistiques : fabriqué après un appel, ouvert à part.
  async function ouvrirPdfBlob() {
    var url = URL.createObjectURL(await pdfBlob());
    window.open(url, '_blank');
    dire('pdf blob ouvert');
  }
  // Une fenêtre ouverte vide, puis envoyée vers un site extérieur.
  function fenetreExterne() {
    var w = window.open('', '_blank');
    if (w) w.location.href = 'https://example.com/';
    dire('fenetre externe demandee');
  }
  async function copier() {
    try { await navigator.clipboard.writeText('TM-2600825'); dire('copie ok'); }
    catch (e) { dire('copie ' + (e && e.name ? e.name : e)); }
  }
  function position() {
    if (!navigator.geolocation) { dire('position absente'); return; }
    navigator.geolocation.getCurrentPosition(
      function (p) { dire('position ok ' + p.coords.latitude.toFixed(2)); },
      function (e) { dire('position erreur ' + e.code); }, { timeout: 15000 });
  }
  async function micro() {
    try {
      var flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      var ok = typeof MediaRecorder !== 'undefined';
      var type = '';
      if (ok) { var r = new MediaRecorder(flux); type = r.mimeType || 'defaut'; r.start(); await new Promise(function (f) { setTimeout(f, 500); }); r.stop(); }
      flux.getTracks().forEach(function (t) { t.stop(); });
      dire('micro ok ' + (ok ? 'enregistreur ' + type : 'sans enregistreur'));
    } catch (e) { dire('micro ' + (e && e.name ? e.name : e)); }
  }
  function capacites() {
    var c = [];
    c.push('autonome=' + (navigator.standalone === true));
    c.push('wakeLock=' + ('wakeLock' in navigator));
    c.push('share=' + (typeof navigator.share === 'function'));
    c.push('notification=' + ('Notification' in window));
    c.push('sw=' + ('serviceWorker' in navigator));
    c.push('idb=' + ('indexedDB' in window));
    c.push('recorder=' + (typeof MediaRecorder !== 'undefined'));
    c.push('uuid=' + (!!(window.crypto && crypto.randomUUID)));
    c.push('beacon=' + (typeof navigator.sendBeacon === 'function'));
    dire('capacites ' + c.join(' '));
  }
  async function camera() {
    try {
      var flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      flux.getTracks().forEach(function (t) { t.stop(); });
      dire('camera ok');
    } catch (e) { dire('camera ' + (e && e.name ? e.name : e)); }
  }
</script>
</body>
</html>
